name: Publish verified Galaxy Battery Check v1.4.8 Windows ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-verified-portable-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve the verified ZIP from GitHub Git blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BLOB_SHA: 49ff03cc1e2d28c1475fa76516ff5c0ae4c3c2b9
        run: |
          set -euo pipefail
          gh api "repos/$REPO/git/blobs/$BLOB_SHA" --jq '.content' | base64 --decode > GalaxyBatteryCheck-v1.4.8-Windows-x64-Portable-Clean.zip
      - name: Check SHA-256 and ZIP integrity
        run: |
          set -euo pipefail
          echo "2e4cd61ac5967a814ea5e72c9f3087d73c2710cbedf79fcb62d5fb75e5bd4d4c  GalaxyBatteryCheck-v1.4.8-Windows-x64-Portable-Clean.zip" | sha256sum --check
          unzip -t GalaxyBatteryCheck-v1.4.8-Windows-x64-Portable-Clean.zip >/dev/null
      - name: Attach archive to existing v1.4.8 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view v1.4.8 --repo "$REPO"
          gh release upload v1.4.8 GalaxyBatteryCheck-v1.4.8-Windows-x64-Portable-Clean.zip --repo "$REPO" --clobber
          gh release view v1.4.8 --repo "$REPO" --json assets --jq '.assets[] | {name, size}'
